name: EAS Update
on:
  push:
    branches:
      - master
      - main
      - fordeployment
    paths:
      - 'UserSide/**' # Only trigger if files in UserSide change

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UserSide
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UserSide/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish EAS Update (Preview)
        run: eas update --branch preview --message "Auto update from GitHub (${{ github.event.head_commit.message }})" --non-interactive
